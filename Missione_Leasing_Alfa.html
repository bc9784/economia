/* Layout: sala operativa notturna — HUD in alto, a sinistra il briefing del Revisore, a destra la serratura da forzare; il caveau si apre a schermo intero */
:root{
  --void:#07060f; --deep:#0e0c1f; --glass:rgba(22,19,48,.62); --glass-hi:rgba(40,35,84,.55); --line:rgba(170,160,255,.16);
  --ink:#eef0ff; --muted:#9a9cc4; --dim:#5e5f86;
  --cyan:#78f0ff; --violet:#a98bff; --pink:#ff8fd8; --gold:#ffcf5a; --gold-deep:#c98a12;
  --laser:#ff3b5c; --ok:#5cffb0; --dare:#7ab8ff; --avere:#ffa77a;
  --holo:conic-gradient(from var(--a),#78f0ff,#a98bff,#ff8fd8,#ffcf5a,#78f0ff);
  --f-d:"Unbounded","Arial Black",system-ui,sans-serif; --f-b:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#fx{z-index:55;pointer-events:none}
.grain{position:fixed;inset:-50%;z-index:1;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}}
.alarmfx{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(255,59,92,.55) 100%)}
.alarmfx.on{animation:siren .9s ease-out}
@keyframes siren{0%,50%{opacity:1}25%,75%{opacity:.35}100%{opacity:0}}
.shake{animation:shk .45s}
@keyframes shk{15%{transform:translate(-10px,3px)}30%{transform:translate(9px,-4px)}45%{transform:translate(-7px,2px)}60%{transform:translate(5px,-2px)}80%{transform:translate(-2px,1px)}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.app{position:relative;z-index:2;min-height:100%;padding-inline:clamp(16px,3vw,40px);padding-block:14px 40px;max-width:1400px;margin:0 auto}

/* glass + holo border */
.glass{position:relative;background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-radius:22px;border:1px solid var(--line)}
.holo::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:var(--holo);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none;opacity:.85}
@keyframes spin{to{--a:360deg}}
.eyebrow{font-family:var(--f-m);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* ---------- INTRO ---------- */
.intro{min-height:calc(100vh - 60px);display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}
.intro h1{font-family:var(--f-d);font-weight:900;font-size:clamp(2.6rem,7.4vw,6.6rem);line-height:.9;letter-spacing:-.035em;margin:14px 0 0;text-wrap:balance}
.intro h1 .w{display:inline-block;animation:rise .9s cubic-bezier(.2,.9,.2,1.2) both}
.intro h1 .holo-t{background:linear-gradient(100deg,var(--cyan),var(--violet) 40%,var(--pink) 70%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes rise{from{transform:translateY(60%) rotate(4deg);opacity:0;filter:blur(8px)}}
.intro p.lead{font-size:1.15rem;color:var(--muted);max-width:52ch;margin:22px 0 0}
.intro p.lead b{color:var(--ink)}
.crew{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.crew span{font-family:var(--f-m);font-size:.78rem;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--glass-hi);color:var(--muted)}
.crew span b{color:var(--gold);font-weight:600}
.start{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:30px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;font-family:var(--f-d);font-weight:600;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:13px 16px;width:min(280px,80vw)}
.cta{position:relative;font-family:var(--f-d);font-weight:800;font-size:1.05rem;letter-spacing:.02em;padding:17px 30px;border-radius:16px;color:#130c24;
  background:linear-gradient(100deg,var(--cyan),var(--violet) 45%,var(--pink));box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 18px 50px -12px rgba(169,139,255,.8);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 24px 60px -10px rgba(255,143,216,.8)}
.cta.gold{background:linear-gradient(100deg,#ffe49a,var(--gold) 50%,#ffb347);box-shadow:0 18px 50px -12px rgba(255,207,90,.8)}
.ghost{font-family:var(--f-d);font-weight:600;font-size:.9rem;padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink)}
.ghost:hover{border-color:var(--violet)}
.introvault{display:grid;place-items:center}
.introvault svg{width:min(420px,80vw);height:auto;filter:drop-shadow(0 30px 80px rgba(169,139,255,.35))}
.introvault .wheel{transform-origin:200px 200px;animation:turn 9s cubic-bezier(.6,0,.4,1) infinite}
@keyframes turn{0%{transform:rotate(0)}30%{transform:rotate(200deg)}55%{transform:rotate(80deg)}100%{transform:rotate(360deg)}}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;padding:10px 14px;margin-bottom:18px;border-radius:18px}
.logo{font-family:var(--f-d);font-weight:900;font-size:.95rem;letter-spacing:-.01em;line-height:1}
.logo small{display:block;font-family:var(--f-m);font-weight:500;font-size:.62rem;letter-spacing:.2em;color:var(--muted);margin-top:4px}
.doors{display:flex;gap:6px;align-items:center}
.door{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-m);font-size:.72rem;border:1px solid var(--line);color:var(--dim);background:rgba(255,255,255,.03)}
.door.done{background:linear-gradient(135deg,var(--gold),#ff9f43);color:#241400;border-color:transparent;font-weight:700}
.door.cur{border-color:var(--cyan);color:var(--ink);box-shadow:0 0 0 3px rgba(120,240,255,.18),0 0 18px rgba(120,240,255,.5)}
.meters{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.loot{display:flex;flex-direction:column;align-items:flex-end}
.loot .v{font-family:var(--f-m);font-weight:700;font-size:1.25rem;color:var(--gold);text-shadow:0 0 18px rgba(255,207,90,.45)}
.alert{display:flex;flex-direction:column;gap:4px}
.alert .bars{display:flex;gap:3px}
.alert .bars i{width:10px;height:16px;border-radius:3px;background:rgba(255,255,255,.08)}
.alert .bars i.on{background:var(--laser);box-shadow:0 0 10px var(--laser)}
.hbtn{font-family:var(--f-m);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.hbtn:hover{border-color:var(--cyan)}

/* ---------- LEVEL ---------- */
.level{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:22px;align-items:start}
.brief{padding:26px;min-width:0}
.brief .date{font-family:var(--f-m);font-size:.8rem;color:var(--cyan);letter-spacing:.14em}
.brief h2{font-family:var(--f-d);font-weight:800;font-size:clamp(1.6rem,3vw,2.5rem);line-height:1;letter-spacing:-.02em;margin:10px 0 16px;text-wrap:balance}
.brief h2 em{font-style:normal;color:var(--gold)}
.mente{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.mente .av{width:42px;height:42px;border-radius:14px;background:conic-gradient(from 200deg,var(--violet),var(--cyan),var(--pink),var(--violet));display:grid;place-items:center;font-family:var(--f-d);font-weight:900;color:#140b28;flex:none}
.mente b{font-family:var(--f-d);font-size:.9rem}
.mente span{display:block;font-size:.8rem;color:var(--muted)}
.brief p{margin:0 0 12px;color:#d6d8f5;max-width:62ch}
.brief p b{color:var(--ink)}
.brief .key{margin-top:16px;padding:14px 16px;border-radius:16px;background:rgba(120,240,255,.07);border:1px solid rgba(120,240,255,.25);font-size:.95rem}
.brief .key .eyebrow{color:var(--cyan);display:block;margin-bottom:4px}
.lock{padding:24px;min-width:0}
.lock .phase{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.pips{display:flex;gap:6px}.pips i{width:26px;height:5px;border-radius:9px;background:rgba(255,255,255,.1)}.pips i.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}.pips i.ok{background:var(--ok)}
.lock h3{font-family:var(--f-d);font-weight:700;font-size:clamp(1.1rem,2vw,1.45rem);line-height:1.2;margin:0 0 6px;text-wrap:balance}
.lock .sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.msg{margin-top:16px;padding:14px 16px;border-radius:16px;font-size:.96rem;display:flex;gap:12px;align-items:flex-start}
.msg .tag{font-family:var(--f-m);font-size:.68rem;letter-spacing:.18em;padding:4px 8px;border-radius:8px;flex:none;margin-top:2px}
.msg.ko{background:rgba(255,59,92,.12);border:1px solid rgba(255,59,92,.45)}.msg.ko .tag{background:var(--laser);color:#fff}
.msg.ok{background:rgba(92,255,176,.1);border:1px solid rgba(92,255,176,.4)}.msg.ok .tag{background:var(--ok);color:#03210f}
.msg.hint{background:rgba(255,207,90,.08);border:1px solid rgba(255,207,90,.35)}.msg.hint .tag{background:var(--gold);color:#2a1a00}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}

/* keypad */
.kp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:18px;align-items:start}
.screen{border-radius:18px;padding:18px 20px;background:linear-gradient(180deg,#05040c,#0d0b1d);border:1px solid rgba(120,240,255,.3);box-shadow:inset 0 0 30px rgba(120,240,255,.08);min-width:0}
.screen .lbl{font-family:var(--f-m);font-size:.7rem;letter-spacing:.2em;color:var(--cyan)}
.screen .val{font-family:var(--f-m);font-weight:700;font-size:clamp(2rem,5vw,3.2rem);line-height:1.1;margin-top:6px;color:var(--ink);text-shadow:0 0 22px rgba(120,240,255,.55);overflow-wrap:anywhere;min-height:1.1em}
.screen .val .cur{display:inline-block;width:.55ch;height:.9em;background:var(--cyan);vertical-align:-.08em;animation:blink 1s steps(2) infinite;margin-left:3px}
@keyframes blink{50%{opacity:0}}
.screen .unit{font-family:var(--f-m);color:var(--muted);font-size:.9rem;margin-top:6px}
.screen.bad{border-color:var(--laser);box-shadow:inset 0 0 40px rgba(255,59,92,.25)}
.screen.good{border-color:var(--ok);box-shadow:inset 0 0 40px rgba(92,255,176,.2)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:56px;border-radius:14px;font-family:var(--f-m);font-weight:600;font-size:1.3rem;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line);transition:transform .08s,background .15s}
.keys button:active{transform:scale(.94);background:rgba(120,240,255,.2)}
.keys button.ok{grid-column:span 3;height:52px;font-family:var(--f-d);font-size:1rem;color:#07210f;background:linear-gradient(100deg,var(--ok),var(--cyan));border:0}
.keys button.fn{font-size:1rem;color:var(--muted)}

/* choices */
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;gap:14px;align-items:center;transition:transform .12s,border-color .12s,background .12s}
.opt:hover{transform:translateX(4px);border-color:var(--violet);background:rgba(169,139,255,.1)}
.opt .l{font-family:var(--f-m);font-weight:700;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);flex:none}
.opt.bad{border-color:var(--laser);background:rgba(255,59,92,.1);opacity:.6}
.opt.good{border-color:var(--ok);background:rgba(92,255,176,.12)}
.opt:disabled{cursor:default;transform:none}

/* ledger / laser */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;min-height:10px}
.tile{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);max-width:100%}
.tile .t{min-width:0}
.tile .t b{display:block;font-size:.92rem;line-height:1.2}
.tile .t span{font-family:var(--f-m);font-size:.85rem;color:var(--gold)}
.tile .sides{display:flex;gap:4px;flex:none}
.tile .sides button{font-family:var(--f-m);font-size:.72rem;font-weight:700;padding:7px 9px;border-radius:9px}
.tile .sides .d{background:rgba(122,184,255,.15);color:var(--dare)}.tile .sides .a{background:rgba(255,167,122,.15);color:var(--avere)}
.tile .sides button:hover{filter:brightness(1.4)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);position:relative}
.col{padding:12px;min-height:120px;min-width:0;display:flex;flex-direction:column;gap:8px}
.col.d{background:linear-gradient(180deg,rgba(122,184,255,.1),transparent)}.col.a{background:linear-gradient(180deg,rgba(255,167,122,.1),transparent)}
.col .h{display:flex;justify-content:space-between;font-family:var(--f-m);font-size:.78rem;letter-spacing:.16em}
.col.d .h{color:var(--dare)}.col.a .h{color:var(--avere)}
.col .tile{cursor:pointer;padding:8px 12px}
.col .tile:hover{border-color:var(--laser)}
.beam{position:absolute;top:0;bottom:0;left:50%;width:3px;transform:translateX(-50%);background:var(--laser);box-shadow:0 0 12px var(--laser),0 0 30px var(--laser);animation:flick .12s infinite alternate}
.beam.ok{background:var(--ok);box-shadow:0 0 12px var(--ok),0 0 30px var(--ok);animation:none}
@keyframes flick{to{opacity:.7}}
.ltot{display:grid;grid-template-columns:1fr 1fr;margin-top:8px;font-family:var(--f-m);font-size:.9rem}
.ltot span:first-child{color:var(--dare)}.ltot span:last-child{color:var(--avere);text-align:right}
.lstate{font-family:var(--f-m);font-size:.8rem;text-align:center;margin-top:6px;color:var(--muted)}

/* timeline */
.tl{display:grid;gap:6px}
.tlr{display:grid;grid-template-columns:54px repeat(12,minmax(0,1fr)) 38px;gap:4px;align-items:center}
.tlr .y{font-family:var(--f-m);font-size:.78rem;color:var(--muted)}
.tlr .c{font-family:var(--f-m);font-size:.8rem;text-align:right;color:var(--gold)}
.mo{height:40px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-family:var(--f-m);font-size:.62rem;color:var(--dim);display:grid;place-items:center;transition:background .12s}
.mo:hover{border-color:var(--cyan)}
.mo.in{background:linear-gradient(180deg,rgba(169,139,255,.55),rgba(120,240,255,.35));color:#fff;border-color:transparent}
.mo.maxi{background:linear-gradient(180deg,rgba(255,207,90,.7),rgba(255,143,216,.4));color:#1a1000}
.mo.edge{box-shadow:0 0 0 2px var(--cyan)}
.mo .r{width:6px;height:6px;border-radius:50%;background:var(--pink);box-shadow:0 0 6px var(--pink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* toggles */
.tg{display:grid;gap:10px}
.tgi{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);text-align:left}
.tgi .sw{width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;flex:none;transition:background .15s}
.tgi .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.tgi[aria-pressed="true"]{border-color:var(--cyan);background:rgba(120,240,255,.08)}
.tgi[aria-pressed="true"] .sw{background:var(--cyan)}.tgi[aria-pressed="true"] .sw::after{transform:translateX(20px)}
.tgi b{display:block}.tgi span{font-family:var(--f-m);color:var(--gold);font-size:.9rem}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:14px 16px;border-radius:16px;background:#05040c;border:1px solid rgba(120,240,255,.3)}
.sum b{font-family:var(--f-m);font-size:1.6rem;color:var(--cyan)}

/* match */
.mt{display:grid;gap:10px}
.mti{padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.mti .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;align-items:baseline;flex-wrap:wrap}
.mti .top b{font-family:var(--f-m);font-size:1.3rem;color:var(--gold)}
.mti .top span{color:var(--muted);font-size:.9rem}
.dest{display:flex;flex-wrap:wrap;gap:6px}
.dest button{font-size:.85rem;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.dest button[aria-pressed="true"]{border-color:var(--violet);background:rgba(169,139,255,.2)}
.dest button.good{border-color:var(--ok);background:rgba(92,255,176,.15)}
.dest button.bad{border-color:var(--laser);background:rgba(255,59,92,.15)}

/* sequence */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.slot{min-height:88px;border-radius:16px;border:1.5px dashed var(--line);padding:12px;font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.slot .n{font-family:var(--f-m);font-size:.72rem;letter-spacing:.18em;color:var(--cyan)}
.slot.fill{border-style:solid;border-color:var(--violet);background:rgba(169,139,255,.1);color:var(--ink)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:.9rem;display:grid;gap:4px}
.scard:hover{border-color:var(--violet)}
.scard:disabled{opacity:.3;cursor:default}
.scard .k{font-family:var(--f-m);font-size:.7rem;letter-spacing:.14em;color:var(--pink)}
.pdl{font-family:var(--f-m);font-size:.82rem;line-height:1.35}
.pdl .dd{color:var(--dare)}.pdl .aa{color:var(--avere)}

/* piano */
.piano{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:.9rem}
.piano th{font-family:var(--f-m);font-size:.66rem;letter-spacing:.14em;color:var(--muted);text-align:right;font-weight:500;padding:0 8px;text-transform:uppercase}
.piano th:first-child,.piano td:first-child{text-align:left}
.piano td{padding:8px;background:rgba(255,255,255,.04);text-align:right;font-family:var(--f-m)}
.piano td:first-child{border-radius:12px 0 0 12px;font-weight:700}.piano td:last-child{border-radius:0 12px 12px 0}
.piano input{width:100px;font:inherit;font-family:var(--f-m);font-weight:700;text-align:right;background:#05040c;border:1px solid rgba(120,240,255,.35);color:var(--cyan);border-radius:10px;padding:8px}
.piano input.good{border-color:var(--ok);color:var(--ok)}.piano input.bad{border-color:var(--laser);color:var(--laser)}
.pianowrap{overflow-x:auto}
.stairs{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:16px;padding:0 4px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.st i{display:block;width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--gold),var(--gold-deep));box-shadow:0 0 20px rgba(255,207,90,.35);transition:height .8s cubic-bezier(.2,.9,.2,1.1);min-height:3px}
.st.q i{background:rgba(255,255,255,.1);box-shadow:none}
.st b{font-family:var(--f-m);font-size:.8rem}.st span{font-family:var(--f-m);font-size:.7rem;color:var(--muted)}

/* ---------- VAULT OVERLAY ---------- */
.vault{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(4,3,10,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:16px;overflow:auto}
.vwrap{display:grid;grid-template-columns:minmax(0,420px) minmax(0,560px);gap:34px;align-items:center;max-width:1100px;width:100%}
.vstage{position:relative;aspect-ratio:1;width:100%;max-width:420px;perspective:1400px;justify-self:center}
.vstage .inside{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,#fff6d6 0%,var(--gold) 30%,#8a5a00 70%,#1a1000 100%);box-shadow:0 0 120px 30px rgba(255,207,90,.55);display:grid;place-items:center;text-align:center}
.vstage .inside b{font-family:var(--f-d);font-weight:900;font-size:clamp(1.6rem,4vw,2.6rem);color:#2a1800;line-height:1}
.vstage .inside span{display:block;font-family:var(--f-m);font-size:.75rem;letter-spacing:.2em;color:#3a2400;margin-top:6px}
.vdoor{position:absolute;inset:0;transform-origin:4% 50%;transition:transform 1.3s cubic-bezier(.6,.05,.3,1) .9s}
.vdoor svg{width:100%;height:100%;display:block}
.vault.open .vdoor{transform:rotateY(-108deg)}
.vdoor .wheel{transform-origin:200px 200px;transition:transform 1s cubic-bezier(.5,0,.3,1)}
.vault.open .vdoor .wheel{transform:rotate(540deg)}
.vdoor .bolt{transition:transform .35s ease-in .7s}
.vault.open .vdoor .bolt{transform:translate(var(--bx),var(--by))}
.vtext{min-width:0;opacity:0;transform:translateY(20px);transition:all .6s 1.6s}
.vault.open .vtext{opacity:1;transform:none}
.vtext h2{font-family:var(--f-d);font-weight:900;font-size:clamp(2rem,5vw,3.6rem);line-height:.95;letter-spacing:-.03em;margin:8px 0 14px}
.vtext h2 .g{color:var(--gold);text-shadow:0 0 30px rgba(255,207,90,.5)}
.vtext p{color:#d6d8f5;margin:0 0 12px}
.vpd{margin:14px 0 18px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.vpd .e{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 14px;font-family:var(--f-m);font-size:.85rem;padding:8px 0;border-bottom:1px dashed var(--line)}
.vpd .e:last-child{border-bottom:0}
.vpd .e .dt{color:var(--cyan)}.vpd .e .dd{color:var(--dare);text-align:right}.vpd .e .aa{color:var(--avere);text-align:right}
.vpd .e .cc{min-width:0}.vpd .e .cc.av{padding-left:22px}
.vpd .cap{font-family:var(--f-m);font-size:.68rem;letter-spacing:.18em;color:var(--muted);margin-bottom:4px}
.gain{font-family:var(--f-m);color:var(--gold);font-weight:700}

/* ---------- FINALE ---------- */
.fin{text-align:left}
.fin h1{font-family:var(--f-d);font-weight:900;font-size:clamp(2.6rem,8vw,7rem);line-height:.88;letter-spacing:-.04em;margin:10px 0 18px}
.fin h1 .holo-t{background:linear-gradient(100deg,#ffe49a,var(--gold) 40%,var(--pink) 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stars{font-size:2.4rem;letter-spacing:.2em;color:var(--gold);text-shadow:0 0 24px rgba(255,207,90,.6)}
.stars .off{color:rgba(255,255,255,.15);text-shadow:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0}
.kpi{padding:18px;border-radius:18px;min-width:0}
.kpi .v{font-family:var(--f-m);font-weight:700;font-size:1.7rem}
.dossier{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px;align-items:start}
.dossier .glass{padding:22px;min-width:0}
.dossier h3{font-family:var(--f-d);font-size:1.15rem;margin:0 0 12px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:34px 1fr;gap:10px;font-size:.95rem}
.rules li::before{content:counter(r);font-family:var(--f-m);font-weight:700;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(169,139,255,.2);color:var(--violet)}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-family:var(--f-m);font-size:.66rem;letter-spacing:.14em;color:var(--muted);font-weight:500;text-transform:uppercase}
.tbl td.n{text-align:right;font-family:var(--f-m);white-space:nowrap}
.tblw{overflow-x:auto}

/* modal dossier */
.modal{position:fixed;inset:0;z-index:60;background:rgba(4,3,10,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;overflow:auto}
.modal .glass{max-width:720px;width:100%;padding:26px}
.modal h3{font-family:var(--f-d);margin:6px 0 12px;font-size:1.4rem}
.modal ul{margin:0 0 12px;padding-left:20px}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.note{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);min-width:0}
.note b{display:block;font-family:var(--f-m);color:var(--gold);font-size:1.05rem}
.note span{font-size:.78rem;color:var(--muted)}
.note.lk b{color:var(--dim)}

@media (max-width:980px){
  .intro,.level,.vwrap,.dossier{grid-template-columns:1fr}
  .introvault{order:-1}.introvault svg{width:min(260px,60vw)}
  .intro{min-height:auto;padding-top:10px}
  .kpis{grid-template-columns:1fr 1fr}
  .vstage{max-width:280px}
}
@media (max-width:620px){
  .kp{grid-template-columns:1fr}
  .cols,.slots,.cards{grid-template-columns:1fr}
  .beam{display:none}
  .tlr{grid-template-columns:34px repeat(12,minmax(0,1fr)) 24px;gap:2px}
  .mo{height:30px;font-size:0;border-radius:6px}
  .doors .door{width:22px;height:22px;font-size:.6rem}
  .notes{grid-template-columns:1fr 1fr}
  .brief,.lock{padding:18px}
  .hud{position:static}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style>

<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="alarmfx" id="alarmfx" aria-hidden="true"></div>
<main class="app" id="app"></main>
<div id="overlay"></div>

<script>
/* =========================================================
   DATI DELL'ESERCIZIO · Alfa srl
   ========================================================= */
const EX = {
  firma:'1/04/n', maxi:12600, rata:2400, nrate:16, riscatto:1500, iva:.22,
  durata:51, medio:1000, risconti:[8400,6000,3600,1200,0]
};
const it = (n,d=0)=>n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur = n=> it(n, Number.isInteger(n)?0:2);

/* =========================================================
   AUDIO (WebAudio, parte dopo il primo clic)
   ========================================================= */
let AC=null, SOUND=true;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } return AC; }
function tone(f,d=.08,type='sine',g=.08,when=0,slide=0){
  if(!SOUND) return; const a=ac(); if(!a) return;
  const t=a.currentTime+when, o=a.createOscillator(), v=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
  v.gain.setValueAtTime(0,t); v.gain.linearRampToValueAtTime(g,t+.01); v.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(v).connect(a.destination); o.start(t); o.stop(t+d+.02);
}
const SFX = {
  key(){ tone(880+Math.random()*200,.05,'square',.03) },
  click(){ tone(520,.06,'triangle',.05) },
  err(){ tone(180,.35,'sawtooth',.09,0,90); tone(620,.18,'square',.05,0,440); tone(620,.18,'square',.05,.22,440) },
  ok(){ [660,880,1320].forEach((f,i)=>tone(f,.14,'triangle',.07,i*.07)) },
  vault(){ tone(70,.8,'sine',.25,0,40); tone(140,.25,'square',.05,.2); [523,659,784,1046,1318].forEach((f,i)=>tone(f,.35,'triangle',.07,1.2+i*.09)) },
  win(){ [523,659,784,1046,784,1046,1318,1568].forEach((f,i)=>tone(f,.3,'triangle',.08,i*.11)) }
};

/* =========================================================
   SFONDO: pavimento laser + fasci + monete
   ========================================================= */
const cv=document.getElementById('bg'), cx=cv.getContext('2d'), fv=document.getElementById('fx'), fx=fv.getContext('2d');
let W=0,H=0,DPR=1, heat=0, coins=[], T0=performance.now();
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
function rs(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=fv.width=W*DPR; cv.height=fv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); fx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',rs); rs();
function frame(now){
  const t=(now-T0)/1000;
  cx.clearRect(0,0,W,H);
  const g=cx.createRadialGradient(W*.7,H*.15,0,W*.7,H*.15,Math.max(W,H)*.9);
  g.addColorStop(0,'#1c1640'); g.addColorStop(.5,'#0c0a1e'); g.addColorStop(1,'#07060f');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // pavimento prospettico
  const hz=H*.58, vx=W*.5;
  cx.lineWidth=1;
  for(let i=-18;i<=18;i++){
    const x=vx+i*W*.09; cx.strokeStyle=`rgba(169,139,255,${.13-Math.abs(i)*.004})`;
    cx.beginPath(); cx.moveTo(vx+i*6,hz); cx.lineTo(x*1+(x-vx)*2.2,H); cx.stroke();
  }
  const sp = RM?0:(t*.35)%1;
  for(let k=0;k<14;k++){
    const z=(k+sp)/14, y=hz+(H-hz)*Math.pow(z,2.3);
    cx.strokeStyle=`rgba(120,240,255,${.02+z*.14})`; cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke();
  }
  const hg=cx.createLinearGradient(0,hz-60,0,hz+20); hg.addColorStop(0,'rgba(255,143,216,0)'); hg.addColorStop(1,'rgba(255,143,216,.12)');
  cx.fillStyle=hg; cx.fillRect(0,hz-60,W,80);
  // fasci laser
  heat=Math.max(0,heat-.012);
  const beams=[[0,-.1,.9],[W,.1,1.3],[W*.5,0,.7]];
  beams.forEach(([ox,ph,spd],i)=>{
    const ang=Math.PI/2+(i===2?0:(i===0?-.55:.55))+Math.sin(t*spd*(RM?0:1)+ph*10)*.35;
    const len=Math.max(W,H)*1.4, ex=ox+Math.cos(ang)*len, ey=-10+Math.sin(ang)*len;
    const a=.12+heat*.6;
    cx.save(); cx.shadowColor='rgba(255,59,92,.9)'; cx.shadowBlur=14+heat*30;
    cx.strokeStyle=`rgba(255,59,92,${a})`; cx.lineWidth=1.2+heat*2.5;
    cx.beginPath(); cx.moveTo(ox,-10); cx.lineTo(ex,ey); cx.stroke(); cx.restore();
  });
  // monete
  coins=coins.filter(c=>c.y<H+40);
  fx.clearRect(0,0,W,H); fx.textAlign='center'; fx.textBaseline='middle';
  coins.forEach(c=>{ c.vy+=.28; c.x+=c.vx; c.y+=c.vy; c.r+=c.vr;
    const sx=Math.cos(c.r*2); fx.save(); fx.translate(c.x,c.y);
    fx.fillStyle='#ffcf5a'; fx.shadowColor='rgba(255,207,90,.8)'; fx.shadowBlur=12;
    fx.beginPath(); fx.ellipse(0,0,Math.max(1,Math.abs(sx)*c.s),c.s,0,0,7); fx.fill();
    if(Math.abs(sx)>.45){ fx.shadowBlur=0; fx.fillStyle='#7a4d00'; fx.font=`800 ${c.s*1.2}px Manrope, Arial, sans-serif`; fx.scale(Math.abs(sx),1); fx.fillText('€',0,1); }
    fx.restore(); });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Tastierino: answer numero, traps {valore: spiegazione}, dec = ammessi decimali
function Keypad(st, done){
  const wrap=h('div'); let v='';
  wrap.innerHTML=`<div class="kp"><div class="screen" id="scr"><div class="lbl">${st.label||'COMBINAZIONE'}</div><div class="val" id="val"><span class="cur"></span></div><div class="unit">${st.unit||'€'}</div></div>
    <div class="keys">${[7,8,9,4,5,6,1,2,3].map(k=>`<button data-k="${k}">${k}</button>`).join('')}
    <button class="fn" data-k="C">C</button><button data-k="0">0</button><button class="fn" data-k="${st.dec?',':'B'}">${st.dec?',':'⌫'}</button>
    ${st.dec?'<button class="fn" data-k="B" style="grid-column:span 3;height:40px">⌫ cancella</button>':''}
    <button class="ok" data-k="OK">Apri</button></div></div><div class="fb"></div>`;
  const val=wrap.querySelector('#val'), scr=wrap.querySelector('#scr'), fb=wrap.querySelector('.fb');
  let tries=0, solved=false;
  const show=()=>{ let [a,b]=v.split(','); const n=a?Number(a).toLocaleString('it-IT'):''; val.innerHTML=(v===''?'':n+(b!==undefined?','+b:''))+'<span class="cur"></span>'; };
  function press(k){
    if(solved) return;
    if(k==='OK') return check();
    SFX.key(); scr.classList.remove('bad');
    if(k==='C') v=''; else if(k==='B') v=v.slice(0,-1);
    else if(k===','){ if(!v.includes(',')&&v) v+=','; }
    else if(v.replace(',','').length<9){ if(v.includes(',')&&v.split(',')[1].length>=2) return; v=(v==='0'?'':v)+k; }
    show();
  }
  function check(){
    if(!v) return;
    const n=Number(v.replace(',','.'));
    if(Math.abs(n-st.answer)<.001){ solved=true; scr.classList.add('good'); SFX.ok(); say(fb,'ok','ESATTO',st.ok||'Combinazione corretta.'); setTimeout(()=>done(tries===0),900); return; }
    tries++; alarm(); scr.classList.add('bad');
    const tr=st.traps&&Object.keys(st.traps).find(k=>Math.abs(Number(k)-n)<.001);
    const extra = tries>=2 && st.hint ? `<br><br><b>Aiuto del Revisore:</b> ${st.hint}` : '';
    say(fb,'ko','ERRORE', (tr?st.traps[tr]:(st.generic||'Non è la combinazione giusta. Rileggi il briefing a sinistra.'))+extra);
    v=''; setTimeout(show,300);
  }
  wrap.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>press(b.dataset.k));
  wrap._key=e=>{ if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('B'); else if(e.key===','||e.key==='.') st.dec&&press(','); else if(e.key==='Enter') press('OK'); };
  return wrap;
}

// Laser della partita doppia
function Ledger(st, done){
  const wrap=h('div'); let tries=0;
  const tiles=st.tiles.map((t,i)=>({...t,i,pos:null}));
  wrap.innerHTML=`<div class="pool"></div><div class="cols"><div class="col d"><div class="h"><span>DARE</span></div></div><div class="beam"></div><div class="col a"><div class="h"><span>AVERE</span></div></div></div>
    <div class="ltot"><span></span><span></span></div><div class="lstate"></div>
    <div class="row"><button class="cta" id="lv">Verifica la scrittura</button><span class="eyebrow">Tocca un conto nelle colonne per rimetterlo tra le carte</span></div><div class="fb"></div>`;
  const pool=wrap.querySelector('.pool'), cd=wrap.querySelector('.col.d'), ca=wrap.querySelector('.col.a'), fb=wrap.querySelector('.fb');
  function render(){
    pool.innerHTML=''; cd.querySelectorAll('.tile').forEach(x=>x.remove()); ca.querySelectorAll('.tile').forEach(x=>x.remove());
    let D=0,A=0;
    tiles.forEach(t=>{
      const inner=`<div class="t"><b>${t.c}</b><span>${eur(t.v)}</span></div>`;
      if(!t.pos){ const e=h('div',{class:'tile'},inner+`<div class="sides"><button class="d" aria-label="Metti in Dare">DARE</button><button class="a" aria-label="Metti in Avere">AVERE</button></div>`);
        e.querySelector('.d').onclick=()=>{t.pos='D';SFX.click();render()}; e.querySelector('.a').onclick=()=>{t.pos='A';SFX.click();render()}; pool.appendChild(e); }
      else { const e=h('button',{class:'tile'},inner); e.onclick=()=>{t.pos=null;SFX.click();render()}; (t.pos==='D'?cd:ca).appendChild(e); if(t.pos==='D') D+=t.v; else A+=t.v; }
    });
    if(!pool.children.length) pool.innerHTML='<span class="eyebrow">Tutti i conti sono in gioco</span>';
    wrap.querySelector('.ltot').innerHTML=`<span>Dare ${eur(D)}</span><span>Avere ${eur(A)}</span>`;
    const bal=D>0&&Math.abs(D-A)<.001;
    wrap.querySelector('.beam').classList.toggle('ok',bal);
    wrap.querySelector('.lstate').textContent = D+A===0?'Scrittura vuota: sistema i conti':(bal?'Dare = Avere · scrittura bilanciata':'Dare ≠ Avere · scrittura non bilanciata');
  }
  render();
  wrap.querySelector('#lv').onclick=()=>{
    let err=null;
    for(const t of tiles){ if(!t.side && t.pos){ err=t.no||`<b>${t.c}</b> non c'entra con questa operazione.`; break; } }
    if(!err) for(const t of tiles){ if(t.side && t.pos && t.pos!==t.side){ err=`<b>${t.c}</b> va in <b>${t.side==='D'?'Dare':'Avere'}</b>. ${t.why||''}`; break; } }
    if(!err) for(const t of tiles){ if(t.side && !t.pos){ err=`Manca ancora un conto. ${t.miss||''}`; break; } }
    if(err){ tries++; alarm(); say(fb,'ko','ERRORE',err); return; }
    SFX.ok(); wrap.querySelector('#lv').disabled=true; say(fb,'ok','BILANCIATA',st.ok||'Scrittura corretta: Dare = Avere.');
    setTimeout(()=>done(tries===0),1100);
  };
  return wrap;
}
// Linea del tempo: 5 anni × 12 mesi
function Timeline(st, done){
  const wrap=h('div'); let a=null,b=null,tries=0;
  const M=['G','F','M','A','M','G','L','A','S','O','N','D'], Y=['n','n+1','n+2','n+3','n+4'];
  const rateAt=(y,m)=> (y===0&&(m===6||m===9)) || (y>=1&&y<=3&&m%3===0) || (y===4&&(m===0||m===3));
  wrap.innerHTML=`<div class="tl"></div><div class="legend"><span><i style="background:var(--pink)"></i>giorno di una rata (anticipata)</span><span><i style="background:linear-gradient(90deg,var(--violet),var(--cyan))"></i>mesi selezionati</span></div>
    <div class="row"><button class="cta" id="tv">Conferma la durata</button><button class="ghost" id="tr">Ricomincia</button></div><div class="fb"></div>`;
  const tl=wrap.querySelector('.tl'), fb=wrap.querySelector('.fb');
  const idx=(y,m)=>y*12+m;
  function render(){
    const lo=a===null?null:Math.min(a,b??a), hi=a===null?null:Math.max(a,b??a);
    tl.innerHTML=Y.map((y,yi)=>{ let cnt=0; const cells=M.map((m,mi)=>{ const k=idx(yi,mi); const inn=lo!==null&&k>=lo&&k<=hi; if(inn) cnt++;
      return `<button class="mo ${inn?'in':''} ${k===a||k===b?'edge':''}" data-k="${k}" aria-label="${m} ${y}">${rateAt(yi,mi)?'<span class="r"></span>':m}</button>`; }).join('');
      return `<div class="tlr"><span class="y">${y}</span>${cells}<span class="c">${cnt||''}</span></div>`; }).join('');
    tl.querySelectorAll('.mo').forEach(e=>e.onclick=()=>{ const k=+e.dataset.k; SFX.key(); if(a===null||b!==null){a=k;b=null} else b=k; render(); });
  }
  render();
  wrap.querySelector('#tr').onclick=()=>{a=null;b=null;render()};
  wrap.querySelector('#tv').onclick=()=>{
    if(a===null||b===null){ say(fb,'hint','COME SI FA','Tocca il <b>primo mese</b> in cui la Alfa usa l\'attrezzatura, poi l\'<b>ultimo mese</b> coperto dall\'ultima rata.'); return; }
    const lo=Math.min(a,b), hi=Math.max(a,b);
    let err=null;
    if(lo===6) err='Hai iniziato a luglio, dalla prima rata: così ottieni 48 mesi. Ma il contratto è firmato il <b>1/04/n</b> e la Alfa usa l\'attrezzatura da subito. Aprile, maggio e giugno li paga il <b>maxicanone</b>: fanno parte della durata.';
    else if(lo!==3) err='Il contratto parte il giorno della firma: <b>1/04/n</b>. Da lì la Alfa usa l\'attrezzatura.';
    else if(hi===idx(4,3)) err='Ti sei fermato ad aprile n+4, il giorno dell\'ultima rata. Ma la rata è <b>anticipata</b>: quella del 1/04/n+4 paga aprile, maggio e giugno.';
    else if(hi!==idx(4,5)) err='Conta le rate: 16 trimestrali dal 1/07/n. L\'ultima cade il <b>1/04/n+4</b> e, essendo anticipata, copre tre mesi da lì in avanti.';
    if(err){ tries++; alarm(); say(fb,'ko','ERRORE',err); return; }
    SFX.ok(); tl.querySelectorAll('.mo').forEach(e=>{ const k=+e.dataset.k; if(k>=3&&k<=5) e.classList.add('maxi'); e.disabled=true; });
    say(fb,'ok','ESATTO','Da aprile n a giugno n+4. I mesi <b>dorati</b> (aprile, maggio, giugno n) non hanno nessuna rata: li copre il maxicanone. Guarda i conteggi a destra: 9 · 12 · 12 · 12 · 6.');
    wrap.querySelector('#tv').disabled=true; setTimeout(()=>done(tries===0),2200);
  };
  return wrap;
}

function Toggles(st, done){
  const wrap=h('div'); let tries=0; const on=st.items.map(()=>false);
  wrap.innerHTML=`<div class="tg">${st.items.map((it2,i)=>`<button class="tgi" data-i="${i}" aria-pressed="false"><div><b>${it2.t}</b><span>${eur(it2.v)}</span></div><i class="sw"></i></button>`).join('')}</div>
    <div class="sum"><span class="eyebrow">Costo totale d'uso</span><b class="num" id="sm">0</b></div>
    <div class="row"><button class="cta" id="gv">Blocca il totale</button></div><div class="fb"></div>`;
  const fb=wrap.querySelector('.fb');
  const upd=()=>{ wrap.querySelector('#sm').textContent=eur(st.items.reduce((s,x,i)=>s+(on[i]?x.v:0),0)); };
  wrap.querySelectorAll('.tgi').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; on[i]=!on[i]; b.setAttribute('aria-pressed',on[i]); SFX.click(); upd(); });
  wrap.querySelector('#gv').onclick=()=>{
    for(let i=0;i<on.length;i++){ const x=st.items[i];
      if(on[i]&&!x.ok){ tries++; alarm(); say(fb,'ko','ERRORE',x.no); return; }
      if(!on[i]&&x.ok){ tries++; alarm(); say(fb,'ko','ERRORE',x.miss); return; } }
    SFX.ok(); wrap.querySelector('#gv').disabled=true; wrap.querySelectorAll('.tgi').forEach(b=>b.disabled=true);
    say(fb,'ok','ESATTO',st.ok); setTimeout(()=>done(tries===0),1300);
  };
  return wrap;
}

// Sequenza: scegli le scritture giuste nell'ordine giusto
function Sequence(st, done){
  const wrap=h('div'); let tries=0, pick=[];
  wrap.innerHTML=`<div class="slots">${st.slots.map((s,i)=>`<div class="slot" data-i="${i}"><span class="n">${s}</span><span class="c">tocca una scrittura qui sotto</span></div>`).join('')}</div>
    <div class="cards">${st.cards.map((c,i)=>`<button class="scard" data-i="${i}"><span class="k">${c.k}</span><span class="pdl">${c.pd}</span></button>`).join('')}</div>
    <div class="row"><button class="cta" id="sv">Conferma l'ordine</button><button class="ghost" id="sr">Ricomincia</button></div><div class="fb"></div>`;
  const fb=wrap.querySelector('.fb');
  const render=()=>{ wrap.querySelectorAll('.slot').forEach((s,i)=>{ const c=st.cards[pick[i]]; s.classList.toggle('fill',!!c); s.querySelector('.c').innerHTML=c?`<span class="pdl">${c.pd}</span>`:'tocca una scrittura qui sotto'; });
    wrap.querySelectorAll('.scard').forEach(b=>b.disabled=pick.includes(+b.dataset.i)||pick.length>=st.slots.length); };
  wrap.querySelectorAll('.scard').forEach(b=>b.onclick=()=>{ pick.push(+b.dataset.i); SFX.click(); render(); });
  wrap.querySelector('#sr').onclick=()=>{ pick=[]; render(); };
  wrap.querySelector('#sv').onclick=()=>{
    if(pick.length<st.slots.length){ say(fb,'hint','MANCA','Riempi tutte e due le caselle.'); return; }
    for(let i=0;i<pick.length;i++){ if(pick[i]!==st.answer[i]){ tries++; alarm(); say(fb,'ko','ERRORE',st.cards[pick[i]].why || st.order); pick=[]; render(); return; } }
    SFX.ok(); wrap.querySelectorAll('button').forEach(b=>b.disabled=true); say(fb,'ok','ESATTO',st.ok); setTimeout(()=>done(tries===0),1400);
  };
  render(); return wrap;
}

      inp.classList.remove('bad'); inp.classList.add('good'); inp.disabled=true;
      if(i+1<rows.length) wrap.querySelector(`.ini[data-i="${i+1}"]`).textContent=eur(r.fin);

    }
    SFX.ok(); wrap.querySelector('#pv').disabled=true; say(fb,'ok','PROVA DEL NOVE',st.ok); setTimeout(()=>done(tries===0),1800);
  };
  return wrap;
}

       pd:[['1/07/n+4','Attrezzature industriali',1500,0],['','IVA ns/credito',330,0],['','Debiti v/fornitori',0,1830],['1/07/n+4','Creditori c/leasing',1500,0],['','Impegni per beni in leasing',0,1500],['31/12/n+4','Amm.to attrezzature industriali',112.5,0],['','F.do amm.to attrezzature ind.',0,112.5]]} }
];

/* =========================================================
   SCHERMATE
   ========================================================= */
function vaultSVG(cls=''){
  const bolts=[...Array(12)].map((_,i)=>{ const a=i*30*Math.PI/180, x=200+Math.cos(a)*168, y=200+Math.sin(a)*168, dx=(Math.cos(a)*-22).toFixed(1), dy=(Math.sin(a)*-22).toFixed(1);
    return `<rect class="bolt" style="--bx:${dx}px;--by:${dy}px" x="${x-9}" y="${y-9}" width="18" height="18" rx="4" transform="rotate(${i*30} ${x} ${y})" fill="url(#bolt)"/>`; }).join('');
  const ticks=[...Array(60)].map((_,i)=>{ const a=i*6*Math.PI/180, r1=i%5?118:112; return `<line x1="${200+Math.cos(a)*r1}" y1="${200+Math.sin(a)*r1}" x2="${200+Math.cos(a)*124}" y2="${200+Math.sin(a)*124}" stroke="rgba(238,240,255,${i%5?.25:.6})" stroke-width="${i%5?1:2}"/>`; }).join('');
  return `<svg viewBox="0 0 400 400" class="${cls}" role="img" aria-label="Porta del caveau">
   <defs>
    <radialGradient id="dg" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#3b3570"/><stop offset=".55" stop-color="#1b1838"/><stop offset="1" stop-color="#0b0a18"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#78f0ff"/><stop offset=".35" stop-color="#a98bff"/><stop offset=".7" stop-color="#ff8fd8"/><stop offset="1" stop-color="#ffcf5a"/></linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9ecff"/><stop offset="1" stop-color="#6c6f9c"/></linearGradient>
    <radialGradient id="hub" cx="45%" cy="40%"><stop offset="0" stop-color="#ffe49a"/><stop offset=".6" stop-color="#ffcf5a"/><stop offset="1" stop-color="#9a6400"/></radialGradient>
   </defs>
   <circle cx="200" cy="200" r="196" fill="#0a0916"/>
   ${bolts}
   <circle cx="200" cy="200" r="182" fill="url(#dg)" stroke="url(#rim)" stroke-width="4"/>
   <circle cx="200" cy="200" r="150" fill="none" stroke="rgba(169,139,255,.35)" stroke-width="1"/>
   <circle cx="200" cy="200" r="140" fill="none" stroke="rgba(120,240,255,.2)" stroke-width="10" stroke-dasharray="2 8"/>
   ${ticks}
   <g class="wheel">
     ${[0,60,120].map(r=>`<rect x="192" y="95" width="16" height="210" rx="8" fill="#2a2656" stroke="rgba(238,240,255,.35)" transform="rotate(${r} 200 200)"/>`).join('')}
     ${[0,60,120,180,240,300].map(r=>`<circle cx="200" cy="92" r="11" fill="url(#bolt)" transform="rotate(${r} 200 200)"/>`).join('')}
     <circle cx="200" cy="200" r="44" fill="url(#hub)"/>
     <circle cx="200" cy="200" r="30" fill="none" stroke="#7a4d00" stroke-width="2" stroke-dasharray="3 4"/>
     <text x="200" y="210" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="30" fill="#4a2e00">€</text>
   </g>
  </svg>`;
}

function intro(){
  $('#app').innerHTML=`
  <section class="intro">
    <div>
      <span class="eyebrow">Il leasing della Alfa srl · caso guidato · 9 porte da aprire</span>
      <h1><span class="w" style="animation-delay:.05s">Missione</span><br><span class="w holo-t" style="animation-delay:.3s">Leasing</span></h1>
      <p class="lead">Nel caveau della Alfa srl c'è un tesoretto: la parte del maxicanone <b>non ancora consumata</b>. La vostra squadra di revisori deve aprire 9 porte blindate, una per ogni passaggio: durata, canone medio, scritture, risconto, giro, piano dei risconti e riscatto. Ogni codice sbagliato fa scattare un avviso. Ogni porta aperta vi insegna un pezzo del leasing.</p>
      <div class="crew"><span>maxicanone <b>12.600</b></span><span><b>16</b> rate trimestrali da <b>2.400</b></span><span>riscatto <b>1.500</b></span><span>firma <b>1/04/n</b></span></div>
      <div class="start">
        <div class="field"><label class="eyebrow" for="crew">Nome della squadra</label><input id="crew" value="${S.crew}" maxlength="24" autocomplete="off"></div>
        <button class="cta" id="go">Inizia la missione →</button>
      </div>
    </div>
    <div class="introvault">${vaultSVG()}</div>
  </section>`;
  $('#go').onclick=()=>{ S.crew=($('#crew').value||'Squadra 5B').trim(); ac(); S.t0=Date.now(); SFX.ok(); S.lvl=0; level(); };
  $('#crew').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#go').click(); });
}

function hud(){
  const el=$('.hud'); if(!el) return;
  el.querySelector('.doors').innerHTML=LV.map((l,i)=>`<span class="door ${i<S.lvl?'done':''} ${i===S.lvl?'cur':''}">${i+1}</span>`).join('');
  el.querySelector('.bars').innerHTML=[...Array(8)].map((_,i)=>`<i class="${i<Math.min(8,S.alarms)?'on':''}"></i>`).join('');
  animLoot();
}
let shownLoot=0;
function animLoot(){ const v=el=>el&&(el.textContent=it(Math.round(shownLoot))); const target=S.loot; const step=()=>{ shownLoot+= (target-shownLoot)*.18; if(Math.abs(target-shownLoot)<1) shownLoot=target; v($('#loot')); if(shownLoot!==target) requestAnimationFrame(step); }; step(); }

function level(){
  const L=LV[S.lvl]; S.step=0;
  $('#app').innerHTML=`
  <header class="hud glass">
    <div class="logo">MISSIONE LEASING<small>${esc(S.crew).toUpperCase()} · ALFA SRL</small></div>
    <div class="doors" aria-label="Porte"></div>
    <div class="meters">
      <div class="alert"><span class="eyebrow">Errori</span><div class="bars"></div></div>
      <div class="loot"><span class="eyebrow">Punti</span><span class="v" id="loot">0 €</span></div>
      <button class="hbtn" id="dos">Taccuino</button>
      <button class="hbtn" id="snd">${SOUND?'Audio on':'Audio off'}</button>
    </div>
  </header>
  <section class="level">
    <article class="brief glass">
      <div class="mente"><div class="av">R</div><div><b>Il Revisore</b><span>Porta ${S.lvl+1} di ${LV.length} · briefing</span></div></div>
      <div class="date">${L.date.toUpperCase()}</div>
      <h2>${L.t}</h2>
      ${L.brief.map(p=>`<p>${p}</p>`).join('')}
      <div class="key"><span class="eyebrow">Regola da portare via</span>${L.key}</div>
    </article>
    <article class="lock glass holo" id="lock"></article>
  </section>`;
  $('#dos').onclick=dossier; $('#snd').onclick=()=>{ SOUND=!SOUND; $('#snd').textContent=SOUND?'Audio on':'Audio off'; };
  hud(); step(); window.scrollTo({top:0,behavior:RM?'auto':'smooth'});
}
let keyHandler=null;
document.addEventListener('keydown',e=>{ if(keyHandler && !(e.target.tagName==='INPUT')) keyHandler(e); });
function step(){
  const L=LV[S.lvl], st=L.steps[S.step], lock=$('#lock');
  lock.innerHTML=`<div class="phase"><span class="eyebrow">Serratura ${S.step+1}/${L.steps.length}</span><div class="pips">${L.steps.map((_,i)=>`<i class="${i<S.step?'ok':i===S.step?'on':''}"></i>`).join('')}</div></div>
    <h3>${st.q}</h3><p class="sub">${st.sub||''}</p>`;
  const comp=COMP[st.c](st, first=>{ S.steps++; if(first){ S.firstTry++; S.loot+=100; } else S.loot+=40; hud(); keyHandler=null;
    S.step++; if(S.step<L.steps.length) step(); else openVault(); });
  lock.appendChild(comp); keyHandler=comp._key||null;
}

function pdHTML(rows){
  let out='', buf=[];
  rows.forEach(r=>{ if(r[0] && buf.length){ out+=entry(buf); buf=[]; } buf.push(r); }); if(buf.length) out+=entry(buf);
  return `<div class="vpd"><div class="cap">PARTITA DOPPIA</div>${out}</div>`;
  function entry(rs){ return `<div class="e">${rs.map(r=>`<span class="dt">${r[0]}</span><span class="cc ${r[3]?'av':''}">${r[3]?'a ':''}${r[1]}</span><span class="dd">${r[2]?eur(r[2]):''}</span><span class="aa">${r[3]?eur(r[3]):''}</span>`).join('')}</div>`; }
}
function openVault(){
  const L=LV[S.lvl];
  S.notes[L.note.k]=L.note;
  const last=S.lvl===LV.length-1;
  $('#overlay').innerHTML=`<div class="vault" id="vault" role="dialog" aria-modal="true" aria-label="Porta aperta">
    <div class="vwrap">
      <div class="vstage"><div class="inside"><div><b>${L.big?'8.400 €':'PORTA '+(S.lvl+1)}</b><span>${L.big?'IL TESORETTO':'APERTA'}</span></div></div><div class="vdoor">${vaultSVG()}</div></div>
      <div class="vtext">
        <span class="eyebrow">Porta ${S.lvl+1} di ${LV.length} · ${L.date}</span>
        <h2>${L.win.h}</h2>
        <p>${L.win.p}</p>
        ${L.win.pd?pdHTML(L.win.pd):''}
        <button class="cta ${last?'gold':''}" id="nx">${last?'Chiudi la missione →':'Prossima porta →'}</button>
      </div>
    </div></div>`;
  SFX.vault();
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('#vault').classList.add('open')));
  setTimeout(()=>{ rain(L.big?220:70); }, 1700);
  $('#nx').onclick=()=>{ $('#overlay').innerHTML=''; coins=[]; S.lvl++; if(S.lvl<LV.length) level(); else finale(); };
  setTimeout(()=>$('#nx')&&$('#nx').focus({preventScroll:true}),2300);
}

function dossier(){
  const all=LV.map(l=>l.note);
  $('#overlay').innerHTML=`<div class="modal" id="md"><div class="glass holo">
    <span class="eyebrow">Taccuino · ${esc(S.crew)}</span><h3>Il dossier Alfa srl</h3>
    <p>Il <b>1/04/n</b> la Alfa srl stipula con la Leasefin spa un contratto di leasing finanziario per un'<b>attrezzatura industriale</b>:</p>
    <ul><li>maxicanone <b>12.600 €</b> + IVA 22%, fatturato e pagato il 1/04/n;</li><li><b>16 canoni trimestrali anticipati</b> di <b>2.400 €</b> + IVA, il primo il <b>1/07/n</b>;</li><li>prezzo di riscatto <b>1.500 €</b> + IVA;</li><li>pagamenti con bonifico bancario.</li></ul>
    <p class="eyebrow" style="margin-top:14px">Combinazioni trovate</p>
    <div class="notes">${all.map(n=>S.notes[n.k]?`<div class="note"><b>${n.v}</b><span>${n.l}</span></div>`:`<div class="note lk"><b>• • •</b><span>${n.l}</span></div>`).join('')}</div>
    <div class="row"><button class="cta" id="mc">Torna alla missione</button></div></div></div>`;
  $('#mc').onclick=()=>$('#overlay').innerHTML=''; $('#md').onclick=e=>{ if(e.target.id==='md') $('#overlay').innerHTML=''; };
}

function finale(){
  SFX.win(); rain(260); setTimeout(()=>rain(160),900);
  const secs=Math.round((Date.now()-S.t0)/1000), mm=Math.floor(secs/60), ss=String(secs%60).padStart(2,'0');
  const stars=S.alarms<=2?3:S.alarms<=7?2:1;
  const title=stars===3?'Missione perfetta':stars===2?'Missione compiuta':'Missione compiuta, con qualche errore';
  $('#app').innerHTML=`
  <section class="fin">
    <span class="eyebrow">${esc(S.crew)} · Alfa srl · leasing finanziario</span>
    <h1><span class="holo-t">${title}</span></h1>
    <div class="stars" aria-label="${stars} stelle su 3">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div>
    <div class="kpis">
      <div class="kpi glass"><span class="eyebrow">Punti</span><div class="v" style="color:var(--gold)">${it(S.loot)}</div></div>
      <div class="kpi glass"><span class="eyebrow">Serrature al primo tentativo</span><div class="v">${S.firstTry}/${S.steps}</div></div>
      <div class="kpi glass"><span class="eyebrow">Errori</span><div class="v" style="color:var(--laser)">${S.alarms}</div></div>
      <div class="kpi glass"><span class="eyebrow">Tempo</span><div class="v">${mm}:${ss}</div></div>
    </div>
    <div class="dossier">
      <div class="glass holo"><h3>Le 7 regole del leasing</h3><ol class="rules">
        <li><span><b>Durata</b>: dalla firma alla fine del periodo coperto dall'ultima rata → <b>51 mesi</b></span></li>
        <li><span><b>Canone medio</b> = (maxicanone + rate) : mesi, senza riscatto e senza IVA → <b>1.000 €</b></span></li>
        <li><span><b>Competenza</b> = canone medio × mesi dell'anno → n: <b>9.000</b></span></li>
        <li><span><b>Risconto</b> = costi registrati − competenza → n: <b>8.400</b></span></li>
        <li><span><b>1/01</b>: riapertura e giro del risconto nei Canoni di leasing</span></li>
        <li><span><b>Ultimo anno</b>: il risconto è zero (prova del nove)</span></li>
        <li><span><b>Riscatto</b>: il bene entra per 1.500 e si ammortizza</span></li></ol></div>
      <div class="glass"><h3>Il piano dei risconti</h3><div class="tblw"><table class="tbl">
        <thead><tr><th>Anno</th><th class="n">Iniziale</th><th class="n">Rate</th><th class="n">Competenza</th><th class="n">Risconto</th></tr></thead><tbody>
        <tr><td>n</td><td class="n">—</td><td class="n">17.400</td><td class="n">9.000</td><td class="n"><b>8.400</b></td></tr>
        <tr><td>n+1</td><td class="n">8.400</td><td class="n">9.600</td><td class="n">12.000</td><td class="n"><b>6.000</b></td></tr>
        <tr><td>n+2</td><td class="n">6.000</td><td class="n">9.600</td><td class="n">12.000</td><td class="n"><b>3.600</b></td></tr>
        <tr><td>n+3</td><td class="n">3.600</td><td class="n">9.600</td><td class="n">12.000</td><td class="n"><b>1.200</b></td></tr>
        <tr><td>n+4</td><td class="n">1.200</td><td class="n">4.800</td><td class="n">6.000</td><td class="n"><b>0 ✓</b></td></tr></tbody></table></div>
        <h3 style="margin-top:18px">Le scritture, in breve</h3><div class="tblw"><table class="tbl"><thead><tr><th>Momento</th><th>Dare</th><th>Avere</th></tr></thead><tbody>
        <tr><td>Firma</td><td>Impegni per beni in leasing</td><td>Creditori c/leasing</td></tr>
        <tr><td>Fattura maxicanone / rata</td><td>Canoni di leasing + IVA ns/credito</td><td>Debiti v/fornitori</td></tr>
        <tr><td>Pagamento</td><td>Debiti v/fornitori</td><td>Banca X c/c</td></tr>
        <tr><td>Dopo ogni pagamento</td><td>Creditori c/leasing</td><td>Impegni per beni in leasing</td></tr>
        <tr><td>31/12</td><td>Risconti attivi</td><td>Canoni di leasing</td></tr>
        <tr><td>1/01 riapertura</td><td>Risconti attivi</td><td>Stato patrimoniale iniziale</td></tr>
        <tr><td>1/01 giro</td><td>Canoni di leasing</td><td>Risconti attivi</td></tr>
        <tr><td>Riscatto</td><td>Attrezzature industriali + IVA ns/credito</td><td>Debiti v/fornitori</td></tr>
        <tr><td>31/12 dopo il riscatto</td><td>Amm.to attrezzature industriali</td><td>F.do amm.to attrezzature industriali</td></tr></tbody></table></div></div>
    </div>
    <div class="row" style="margin-top:24px"><button class="cta" id="again">Rigioca la missione</button></div>
  </section>`;
  $('#again').onclick=()=>{ Object.assign(S,{lvl:0,step:0,loot:0,alarms:0,tries:0,notes:{},firstTry:0,steps:0}); shownLoot=0; intro(); };
  window.scrollTo({top:0});
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

intro();
</script>
