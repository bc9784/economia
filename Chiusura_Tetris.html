/* Layout: sala macchine industriale — a sinistra il pozzo 3D in cui cadono i conti, a destra il registro con il conto a T che si riempie; HUD d'acciaio in alto */
:root{
  --ink:#e9edf2; --muted:#8e99a8; --dim:#56606d;
  --void:#07090c; --steel-0:#0d1116; --steel-1:#151b22; --steel-2:#1e262f; --steel-3:#2b3541; --edge:rgba(190,205,225,.14);
  --amber:#ffb000; --molten:#ff5a1f; --dare:#4fb3ff; --avere:#ff8a3d; --ok:#3dff8a; --ko:#ff2d3d; --gold:#ffd166;
  --f-d:"Big Shoulders","Impact","Arial Narrow",sans-serif; --f-b:"Chakra Petch","Segoe UI",system-ui,sans-serif; --f-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --cut:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-b);font-weight:500;font-size:16px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:70;pointer-events:none}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
.vign{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.65) 100%)}
.flash{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0}
.flash.ko{background:radial-gradient(ellipse at center,rgba(255,45,61,.0) 30%,rgba(255,45,61,.55));animation:fl .7s ease-out}
.flash.ok{background:radial-gradient(ellipse at center,rgba(255,176,0,.25),transparent 70%);animation:fl .6s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.app{position:relative;z-index:2;min-height:100%;padding-inline:clamp(16px,2.4vw,36px);padding-block:14px 30px;max-width:1600px;margin:0 auto}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-m);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* pannelli d'acciaio con angoli smussati */
.plate{position:relative;background:linear-gradient(160deg,var(--steel-2),var(--steel-1) 55%,var(--steel-0));
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid var(--edge);clip-path:inherit}
.brushed{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),linear-gradient(160deg,var(--steel-2),var(--steel-1) 55%,var(--steel-0))}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--amber) 0 12px,#111 12px 24px);opacity:.9}
.rivet{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c9d2dc,#4a5563 70%);box-shadow:0 1px 2px #000}

/* titoli 3D estrusi */
.t3d{font-family:var(--f-d);font-weight:900;text-transform:uppercase;letter-spacing:.01em;line-height:.82;color:#f4f6f9;
  text-shadow:0 1px 0 #b8c0ca,0 2px 0 #9aa3ae,0 3px 0 #7e8793,0 4px 0 #656e79,0 5px 0 #4f5761,0 6px 0 #3b424a,0 7px 0 #2b3037,0 10px 18px rgba(0,0,0,.8),0 0 40px rgba(255,176,0,.15)}
.t3d .hot{color:var(--amber);text-shadow:0 1px 0 #d98f00,0 2px 0 #b87800,0 3px 0 #986300,0 4px 0 #7a4f00,0 5px 0 #5e3d00,0 6px 0 #452d00,0 7px 0 #2e1e00,0 10px 18px rgba(0,0,0,.8),0 0 50px rgba(255,176,0,.45)}

/* ---------- INTRO ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center;min-height:calc(100vh - 50px)}
.intro h1{font-size:clamp(4rem,11vw,10.5rem);margin:10px 0 0}
.intro .lead{font-size:1.15rem;color:#c5ccd6;max-width:58ch;margin:26px 0 0}
.intro .lead b{color:var(--amber)}
.cfg{display:grid;gap:14px;margin-top:26px;max-width:720px}
.cfg .row{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:11px 16px;font-weight:700;letter-spacing:.04em;background:var(--steel-2);border:1px solid var(--edge);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);color:var(--muted)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#3a2a00,#1d1500);color:var(--amber);border-color:var(--amber);box-shadow:inset 0 0 18px rgba(255,176,0,.25)}
.seg button small{display:block;font-family:var(--f-m);font-size:.66rem;font-weight:500;letter-spacing:.1em;color:var(--dim)}
.go{margin-top:30px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big{position:relative;font-family:var(--f-d);font-weight:900;font-size:1.9rem;letter-spacing:.06em;text-transform:uppercase;padding:14px 38px 12px;color:#1a0f00;
  background:linear-gradient(180deg,#ffd35c,var(--amber) 45%,#d98200);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  box-shadow:0 0 0 1px #ffe39a inset;filter:drop-shadow(0 12px 30px rgba(255,176,0,.45));transition:transform .12s,filter .12s}
.big:hover{transform:translateY(-2px);filter:drop-shadow(0 16px 40px rgba(255,176,0,.7))}
.big:active{transform:translateY(1px)}
.big.steel{background:linear-gradient(180deg,#48525f,#262e37);color:var(--ink);box-shadow:0 0 0 1px #6a7584 inset;filter:none;font-size:1.3rem;padding:12px 26px 10px}
.hint{font-family:var(--f-m);font-size:.78rem;color:var(--muted)}
.hint kbd{font-family:var(--f-m);border:1px solid var(--steel-3);border-bottom-width:3px;padding:1px 7px;border-radius:4px;color:var(--ink);background:var(--steel-1)}
.demo{position:relative;height:520px;perspective:1200px}
.demo .tower{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(18deg) rotateY(-24deg);animation:sway 9s ease-in-out infinite}
@keyframes sway{50%{transform:rotateX(14deg) rotateY(-12deg)}}
.demo .blk{position:absolute;left:50%;margin-left:-160px}

/* ---------- BLOCCO 3D ---------- */
.blk{--w:300px;--h:78px;--d:26px;--c1:#3a4552;--c2:#252d36;--glow:transparent;width:var(--w);height:var(--h);position:absolute;transform-style:preserve-3d}
.blk .f{position:absolute;backface-visibility:hidden}
.blk .fr{inset:0;transform:translateZ(calc(var(--d)/2));background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.35),0 0 26px var(--glow);display:flex;flex-direction:column;justify-content:center;padding:6px 14px;overflow:hidden}
.blk .fr::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.14) 45%,transparent 60%);transform:translateX(-100%);animation:sheen 3.5s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.blk .tp{left:0;width:var(--w);height:var(--d);top:calc((var(--h) - var(--d))/2);transform:rotateX(90deg) translateZ(calc(var(--h)/2));background:linear-gradient(90deg,var(--c1),color-mix(in srgb,var(--c1) 70%,#fff))}
.blk .bt{left:0;width:var(--w);height:var(--d);top:calc((var(--h) - var(--d))/2);transform:rotateX(-90deg) translateZ(calc(var(--h)/2));background:#0b0e12}
.blk .rt{top:0;height:var(--h);width:var(--d);left:calc((var(--w) - var(--d))/2);transform:rotateY(90deg) translateZ(calc(var(--w)/2));background:linear-gradient(180deg,color-mix(in srgb,var(--c2) 80%,#000),#0b0e12)}
.blk .lf{top:0;height:var(--h);width:var(--d);left:calc((var(--w) - var(--d))/2);transform:rotateY(-90deg) translateZ(calc(var(--w)/2));background:linear-gradient(180deg,color-mix(in srgb,var(--c2) 80%,#000),#0b0e12)}
.blk .nm{font-weight:700;font-size:clamp(.9rem,1.25vw,1.12rem);line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.6);position:relative}
.blk .am{font-family:var(--f-m);font-size:clamp(.8rem,1.05vw,.98rem);margin-top:3px;position:relative;display:flex;gap:8px;align-items:center}
.blk .sd{font-family:var(--f-m);font-weight:800;font-size:.7rem;padding:1px 6px;letter-spacing:.08em}
.blk .sd.D{background:var(--dare);color:#001426}.blk .sd.A{background:var(--avere);color:#260e00}
.blk.live{--c1:#56626f;--c2:#2d3640;--glow:rgba(255,176,0,.35)}
.blk.okb{--c1:#1f6b42;--c2:#0f3a24;--glow:rgba(61,255,138,.55)}
.blk.junk{--c1:#7a1720;--c2:#3d0a0f;--glow:rgba(255,45,61,.45)}
.blk.junk .fr{background:repeating-linear-gradient(-45deg,rgba(0,0,0,.25) 0 10px,transparent 10px 20px),linear-gradient(180deg,var(--c1),var(--c2))}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.hud .brand{padding:10px 18px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.hud .brand b{font-family:var(--f-d);font-weight:900;font-size:1.6rem;letter-spacing:.04em;line-height:.9;text-transform:uppercase}
.hud .brand b span{color:var(--amber)}
.hud .cell{padding:8px 16px;min-width:108px;display:flex;flex-direction:column;justify-content:center}
.hud .cell .v{font-family:var(--f-m);font-weight:700;font-size:1.45rem;line-height:1.1}
.hud .cell .v.amber{color:var(--amber);text-shadow:0 0 16px rgba(255,176,0,.5)}
.hud .lvl{flex:1;min-width:220px;padding:8px 16px}
.hud .lvl .v{font-family:var(--f-d);font-weight:800;font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.steps{display:flex;gap:4px;margin-top:5px}
.steps i{flex:1;height:5px;background:var(--steel-3)}
.steps i.on{background:var(--amber);box-shadow:0 0 8px var(--amber)}.steps i.done{background:#7a5a10}
.hud .ctl{display:flex;gap:8px;align-items:center}
.hbtn{padding:10px 14px;font-family:var(--f-m);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;background:var(--steel-2);border:1px solid var(--edge);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.hbtn:hover{border-color:var(--amber);color:var(--amber)}

/* ---------- GIOCO ---------- */
.game{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:18px;align-items:start}
.pit{position:relative;padding:14px 14px 12px}
.stage{position:relative;perspective:1500px;perspective-origin:50% -10%}
.well{position:relative;height:min(64vh,640px);transform:rotateX(12deg);transform-origin:50% 100%;transform-style:preserve-3d;
  background:linear-gradient(180deg,rgba(10,13,17,.9),rgba(18,23,29,.95));border:1px solid var(--edge);box-shadow:inset 0 0 60px rgba(0,0,0,.8)}
.lanes{position:absolute;inset:0;display:grid;transform-style:preserve-3d}
.lane{position:relative;border-right:1px dashed rgba(190,205,225,.12);cursor:pointer;transform-style:preserve-3d;
  background-image:linear-gradient(rgba(190,205,225,.05) 1px,transparent 1px);background-size:100% 40px}
.lane:last-child{border-right:0}
.lane:hover{background-color:rgba(255,176,0,.035)}
.lane.aim{background-color:rgba(255,176,0,.07)}
.lane .beam{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,176,0,0),rgba(255,176,0,.5));opacity:0;transition:opacity .15s}
.lane.aim .beam{opacity:1}
.lhead{position:absolute;left:0;right:0;top:0;padding:10px 12px 8px;text-align:center;z-index:2;background:linear-gradient(180deg,rgba(7,9,12,.95),rgba(7,9,12,0))}
.lhead b{display:block;font-family:var(--f-d);font-weight:900;font-size:clamp(1.15rem,1.9vw,1.8rem);text-transform:uppercase;letter-spacing:.03em;line-height:.95}
.lhead span{display:block;font-family:var(--f-m);font-size:.68rem;letter-spacing:.1em;color:var(--muted);margin-top:4px}
.lane.D .lhead b{color:var(--dare)}.lane.A .lhead b{color:var(--avere)}.lane.N .lhead b{color:var(--ink)}.lane.G .lhead b{color:var(--gold)}
.lfoot{position:absolute;left:8px;right:8px;bottom:8px;height:62px;padding:8px 10px;z-index:2;background:linear-gradient(180deg,#1b232c,#0f1419);border:1px solid var(--edge);border-top:2px solid var(--amber);
  display:flex;flex-direction:column;justify-content:center;transform:translateZ(8px)}
.lane.D .lfoot{border-top-color:var(--dare)}.lane.A .lfoot{border-top-color:var(--avere)}
.lfoot .lbl{font-size:.6rem}
.lfoot .v{font-family:var(--f-m);font-weight:700;font-size:clamp(.95rem,1.5vw,1.3rem)}
.lfoot.pulse{animation:pulse .5s}
@keyframes pulse{0%{box-shadow:0 0 0 rgba(255,176,0,0)}40%{box-shadow:0 0 30px rgba(255,176,0,.8)}100%{box-shadow:0 0 0 rgba(255,176,0,0)}}
.fallzone{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d}
.shake{animation:shk .45s}
@keyframes shk{15%{transform:translate(-12px,4px)}30%{transform:translate(10px,-5px)}45%{transform:translate(-8px,3px)}60%{transform:translate(6px,-2px)}80%{transform:translate(-3px,1px)}}
.glitch{animation:gl .35s steps(2)}
@keyframes gl{0%{filter:none}25%{filter:hue-rotate(-40deg) saturate(2);transform:translateX(4px)}50%{filter:invert(.1) hue-rotate(30deg);transform:translateX(-4px)}100%{filter:none}}
.pads{display:grid;grid-template-columns:1fr 1.4fr 1fr auto;gap:10px;margin-top:12px}
.pad{height:62px;font-family:var(--f-d);font-weight:900;font-size:1.8rem;background:linear-gradient(180deg,#3a4451,#1c232b);border:1px solid #56606d;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.pad:active{transform:translateY(2px);background:linear-gradient(180deg,#5a4200,#2a1f00);color:var(--amber)}
.pad.drop{color:#1a0f00;background:linear-gradient(180deg,#ffd35c,var(--amber) 50%,#d98200);border-color:#ffe39a;font-size:1.3rem;letter-spacing:.08em}
.pad.small{font-size:.8rem;font-family:var(--f-m);letter-spacing:.14em;padding:0 16px}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;font-size:clamp(3rem,7vw,6rem);white-space:nowrap;opacity:0}
.banner.go{animation:ban 1.1s cubic-bezier(.2,.9,.2,1)}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4) rotateX(60deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1) rotateX(0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}

/* errore: pannello sopra il pozzo */
.stop{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(7,9,12,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:18px}
.stop .box{max-width:640px;width:100%;padding:22px 24px 20px;border-left:6px solid var(--ko)}
.stop h3{font-family:var(--f-d);font-weight:900;font-size:2.2rem;text-transform:uppercase;margin:4px 0 8px;color:var(--ko);letter-spacing:.02em;line-height:.95}
.stop h3 small{display:block;color:var(--ink);font-size:1.3rem;margin-top:6px}
.stop p{margin:0 0 10px;font-size:1.05rem;color:#d6dce4}
.stop .pd{font-family:var(--f-m);font-size:.9rem;background:#0a0d11;border:1px solid var(--edge);padding:10px 12px;margin:10px 0 14px}
.stop .pd .d{color:var(--dare)}.stop .pd .a{color:var(--avere)}

/* registro */
.side{display:grid;gap:14px;min-width:0}
.reg{padding:16px 16px 14px}
.reg h4{font-family:var(--f-d);font-weight:900;font-size:1.55rem;text-transform:uppercase;letter-spacing:.02em;margin:4px 0 10px;line-height:1}
.tacc{display:grid;grid-template-columns:1fr 1fr;border-top:3px solid var(--ink)}
.tacc>div{min-width:0;padding:6px 8px 0}
.tacc>div+div{border-left:3px solid var(--ink)}
.tacc .hd{font-family:var(--f-m);font-size:.66rem;letter-spacing:.18em;font-weight:700}
.tacc .d .hd{color:var(--dare)}.tacc .a .hd{color:var(--avere)}
.tacc ul{list-style:none;margin:6px 0 0;padding:0;font-size:.82rem;min-height:150px;max-height:190px;overflow:hidden;display:flex;flex-direction:column;gap:3px}
.tacc li{display:flex;justify-content:space-between;gap:6px;animation:in .4s}
.tacc li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c5ccd6}
.tacc li span:last-child{font-family:var(--f-m);white-space:nowrap}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:6px;border-top:1px solid var(--steel-3)}
.tot div{padding:6px 8px;font-family:var(--f-m);font-weight:700;font-size:1.02rem}
.tot div:first-child{color:var(--dare)}.tot div:last-child{color:var(--avere);text-align:right}
.saldo{margin-top:8px;padding:9px 10px;background:#0a0d11;border:1px solid var(--edge);display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.saldo b{font-family:var(--f-m);font-size:1.1rem;color:var(--amber)}
.rule{padding:14px 16px;border-left:4px solid var(--amber)}
.rule p{margin:4px 0 0;font-size:.98rem}
.last{padding:14px 16px;min-height:120px}
.last p{margin:6px 0 0;font-size:.95rem;color:#d6dce4}
.last .tag{display:inline-block;font-family:var(--f-m);font-size:.66rem;font-weight:700;letter-spacing:.16em;padding:3px 8px;margin-bottom:2px}
.last .tag.ok{background:var(--ok);color:#002410}.last .tag.ko{background:var(--ko);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{padding:10px;background:#0a0d11;border:1px solid var(--edge)}
.mini b{display:block;font-family:var(--f-d);font-size:1.1rem;text-transform:uppercase}
.mini .r{display:flex;justify-content:space-between;font-family:var(--f-m);font-size:.85rem;margin-top:4px}

/* ---------- BRIEFING & DEBRIEF ---------- */
.brief{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:34px;align-items:center;min-height:calc(100vh - 60px);padding-block:20px}
.brief .no{margin-top:.12em;font-size:clamp(9rem,22vw,19rem);animation:flip 1s cubic-bezier(.2,.9,.2,1.1) both;transform-origin:50% 100%}
@keyframes flip{from{transform:perspective(900px) rotateX(-95deg);opacity:0}}
.brief h2{font-size:clamp(2.8rem,6vw,5.4rem);margin:8px 0 18px}
.brief .txt{padding:24px 26px}
.brief .txt p{margin:0 0 12px;font-size:1.12rem;color:#d6dce4;max-width:70ch}
.brief .txt p b{color:#fff}
.brief .txt .lanesdemo{display:grid;gap:10px;margin:16px 0}
.lanesdemo div{padding:10px 14px;background:#0a0d11;border:1px solid var(--edge);border-left:4px solid var(--amber)}
.lanesdemo div b{font-family:var(--f-d);font-size:1.3rem;text-transform:uppercase;display:block}
.lanesdemo .D{border-left-color:var(--dare)}.lanesdemo .D b{color:var(--dare)}.lanesdemo .A{border-left-color:var(--avere)}.lanesdemo .A b{color:var(--avere)}.lanesdemo .G b{color:var(--gold)}
.pdbox{font-family:var(--f-m);font-size:.92rem;background:#0a0d11;border:1px solid var(--edge);padding:12px 14px;margin:12px 0}
.pdbox .d{color:var(--dare)}.pdbox .a{color:var(--avere)}.pdbox .c{color:var(--muted)}
.deb{padding-block:20px}
.deb h2{font-size:clamp(2.6rem,6vw,5rem);margin:6px 0 16px}
.debg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:18px;align-items:start}
.art{padding:18px 20px}
.art h4{font-family:var(--f-d);font-weight:900;font-size:1.4rem;text-transform:uppercase;margin:0 0 8px}
.jr{width:100%;border-collapse:collapse;font-family:var(--f-m);font-size:.86rem}
.jr td{padding:4px 6px;border-bottom:1px solid rgba(190,205,225,.07);vertical-align:top}
.jr td.n{text-align:right;white-space:nowrap}
.jr td.i{padding-left:26px;color:#c5ccd6}
.jr tr.t td{border-top:2px solid var(--ink);font-weight:700;color:var(--amber)}
.jr .d{color:var(--dare)}.jr .a{color:var(--avere)}
.check{margin-top:12px;padding:12px 14px;border:1px solid var(--ok);background:rgba(61,255,138,.08);font-weight:700;display:flex;gap:10px;align-items:center}
.check.ko{border-color:var(--ko);background:rgba(255,45,61,.08)}
.statsg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{padding:14px}
.stat .v{font-family:var(--f-m);font-weight:700;font-size:1.6rem}
.quiz{padding:18px 20px;margin-top:14px;border-left:4px solid var(--amber)}
.quiz h4{font-family:var(--f-d);font-size:1.5rem;text-transform:uppercase;margin:0 0 10px}
.qopts{display:grid;gap:8px}
.qopt{text-align:left;padding:12px 14px;background:#0a0d11;border:1px solid var(--edge);font-family:var(--f-m);font-size:.9rem}
.qopt:hover{border-color:var(--amber)}
.qopt.good{border-color:var(--ok);background:rgba(61,255,138,.12)}.qopt.bad{border-color:var(--ko);background:rgba(255,45,61,.12);opacity:.7}
.qfb{margin-top:10px;font-size:.98rem}
.acts{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px;align-items:center}

/* flow finale */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px}
.flow span{padding:8px 12px;background:#0a0d11;border:1px solid var(--edge);font-weight:700;font-size:.9rem}
.flow i{color:var(--amber);font-style:normal;font-weight:900}
.flow span.k{border-color:var(--amber);color:var(--amber)}

  .intro,.game,.brief,.debg{grid-template-columns:1fr}

  .errs{grid-template-columns:1fr}
}

  .statsg{grid-template-columns:1fr 1fr}
  .blk{--h:66px}
  .lhead span{display:none}

  const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate), ch=b.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);

    cx.fillStyle=`rgba(30,38,47,${.25+z*.4})`; cx.fillRect(x-8*sc,y2-h,16*sc,h); cx.fillStyle=`rgba(255,176,0,${.1+z*.3})`; cx.fillRect(x-8*sc,y2-h,16*sc,2*sc); } }

function why(lv,c){
  const s=side(c), amt=eur(c.v);
  if(lv==='foto'){
    if(L1X[c.n]) return L1X[c.n];
    if(/^Fondo ammortamento/.test(c.n)) return 'Il fondo ammortamento rettifica il valore del bene: segue il bene nella situazione patrimoniale.';
    if(/c\/rimanenze finali/.test(c.n)) return 'È un conto economico: rettifica i costi dell\'anno togliendo quello che non è stato consumato. Situazione economica.';
    if(/c\/esistenze iniziali/.test(c.n)) return 'Le esistenze iniziali sono le rimanenze dell\'anno scorso girate a costo: conto economico.';
    return c.sp ? `${c.n} è un ${cat(c)}: fa parte del patrimonio, quindi va nella situazione patrimoniale.`
                : `${c.n} è un ${cat(c)}: forma il reddito dell'anno, quindi va nella situazione economica.`;
  }
  if(lv==='epi'){
    let lead='';
    if(cat(c)==='rettifica di ricavo') lead=`${c.n} riduce i ricavi, ma ha saldo Dare. `;
    else if(/c\/rimanenze finali/.test(c.n)) lead='Le rimanenze finali rettificano i costi: hanno saldo Avere. ';
    else if(cat(c).startsWith('rettifica di costo')) lead=`${c.n} rettifica i costi: ha saldo Avere. `;
    else if(c.c==='rettc') lead=`${c.n} riduce i costi: ha saldo Avere. `;
    return lead + (s==='D' ? `Saldo Dare: il conto si chiude in Avere e il Conto di risultato economico si addebita.` : `Saldo Avere: il conto si chiude in Dare e il Conto di risultato economico si accredita.`);
  }
  if(lv==='chi'){
    let lead='';
    if(/^Fondo/.test(c.n)) lead='Trappola: nel conto Bilancio di chiusura il fondo va in Avere, perché ha saldo Avere. È solo nello Stato patrimoniale del codice civile che si sottrae dall\'attivo. ';
    else if(c.n==='Banche c/c passivi') lead='Saldo Avere: è uno scoperto, cioè un debito verso la banca. ';
    else if(c.n==="Utile d'esercizio") lead='Dopo la rilevazione, l\'utile ha saldo Avere: fa parte del patrimonio netto. ';
    else if(c.c==='rsp') lead='Il risconto passivo ha saldo Avere. ';
    else if(c.c==='rta') lead='Il rateo attivo è un credito presunto: saldo Dare. ';
    return lead + (s==='D' ? `Attività con saldo Dare: si chiude con «Bilancio di chiusura a ${c.n}». Nel Bilancio di chiusura va in Dare.` : `Saldo Avere: si chiude con «${c.n} a Bilancio di chiusura». Nel Bilancio di chiusura va in Avere.`);
  }
  if(lv==='ria'){
    let lead='';
    if(/^Fondo/.test(c.n)) lead='I fondi tornano con saldo Avere, come erano prima della chiusura. ';
    if(c.n==="Utile d'esercizio") lead='L\'utile si riapre in Avere: sarà l\'assemblea dei soci a decidere come destinarlo. ';
    return lead + (s==='D' ? `In chiusura era in Avere del conto (Bilancio di chiusura a ${c.n}). Si riapre al contrario: «${c.n} a Bilancio di apertura». Torna con saldo Dare.`
                           : `In chiusura era in Dare del conto (${c.n} a Bilancio di chiusura). Si riapre al contrario: «Bilancio di apertura a ${c.n}». Torna con saldo Avere.`);
  }
  if(lv==='giro'){
    const tg=G.giro[c.n];
    if(tg) return c.c==='rsp' ? `Il ricavo sospeso l'anno scorso deve tornare ricavo di quest'anno: «${c.n} a ${tg}» ${amt}.`
                              : `${c.n} è un costo sospeso l'anno scorso: nel nuovo anno deve tornare costo. «${tg} a ${c.n}» ${amt}. Senza il giro quel costo sparirebbe.`;
    if(/Ratei/.test(c.n)) return 'Il rateo non si gira: resta aperto e si chiuderà quando arriva l\'incasso o il pagamento.';
    return `${c.n} è un valore patrimoniale che vive anche nel nuovo anno: resta aperto così com'è. Nessun giro.`;
  }
  if(lv==='boss'){
    return (c.sp ? `Conto patrimoniale: si chiude nel Bilancio di chiusura` : `Conto economico: si chiude nell'epilogo, nel Conto di risultato economico`) + `, dalla parte del suo saldo (${sideW(s)}).`;
  }
  return '';
}
function pdLine(lv,c){
  const s=side(c), a=eur(c.v);

  if(lv==='ria') return s==='D'?`<span class="d">${esc(c.n)}</span> a <span class="a">Bilancio di apertura</span> ${a}`:`<span class="d">Bilancio di apertura</span> a <span class="a">${esc(c.n)}</span> ${a}`;
  if(lv==='giro'){ const tg=G.giro[c.n]; if(!tg) return '<span class="c">nessuna scrittura</span>'; return c.c==='rsp'?`<span class="d">${esc(c.n)}</span> a <span class="a">${esc(tg)}</span> ${a}`:`<span class="d">${esc(tg)}</span> a <span class="a">${esc(c.n)}</span> ${a}`; }

function deckFor(lv){
  const D=DATA[CFG.co]; let pool;
  const utile={n:"Utile d'esercizio",v:-D.utile,c:'pn',sp:true};
  if(lv.k==='foto') pool=D.cards.slice();
  else if(lv.k==='epi') pool=D.cards.filter(c=>!c.sp);
  else if(lv.k==='chi'||lv.k==='ria') pool=D.cards.filter(c=>c.sp).concat([utile]);
  else if(lv.k==='giro'){ const g=Object.keys(D.giro); pool=D.cards.filter(c=>g.includes(c.n)||/^Ratei/.test(c.n));
    const others=shuffle(D.cards.filter(c=>c.sp&&!g.includes(c.n)&&!/^Ratei/.test(c.n))).slice(0,Math.max(3,CFG.size-pool.length)); return {play:shuffle(pool.concat(others)),all:pool.concat(others)}; }
  else pool=D.cards.concat([utile]);
  const all=pool.slice();
  if(CFG.size>=999) return {play:shuffle(pool.slice()),all};
  const n=lv.k==='boss'?Math.round(CFG.size*1.3):CFG.size;
  const tr=shuffle(pool.filter(c=>(TRAPS[lv.k]||[]).includes(c.n))).slice(0,Math.ceil(n*.55));
  const rest=shuffle(pool.filter(c=>!tr.includes(c))).slice(0,n-tr.length);
  return {play:shuffle(tr.concat(rest)),all};
}

function banner(t){ const b=$('#ban'); if(!b) return; b.innerHTML=`<span class="hot">${t}</span>`; b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); }
function geom(){ const w=$('#well'); const r=w.getBoundingClientRect(); return {w:w.clientWidth,h:w.clientHeight,r}; }
function laneX(i,bw){ const g=geom(), n=L.lv.lanes.length, lw=g.w/n; return i*lw+(lw-bw)/2; }
function blockSize(){ const g=geom(), n=L.lv.lanes.length; const bw=Math.min(g.w/n-16,340); const bh=innerWidth<620?66:78; return {bw,bh}; }
function spawn(){
  if(L.i>=L.deck.length){ endLevel(); return; }
  const c=L.deck[L.i]; const {bw,bh}=blockSize(); const n=L.lv.lanes.length;
  const el=document.createElement('div'); el.innerHTML=blkHTML(c,'live',`--w:${bw}px;--h:${bh}px`); const b=el.firstElementChild;
  $('#fz').appendChild(b);
  L.fall={c,el:b,lane:Math.floor((n-1)/2),y:70,soft:false,hard:false,bw,bh};
  place(); $('#bl').textContent=`${L.i+1}/${L.deck.length}`;
}
function place(){ const f=L.fall; if(!f) return; f.el.style.transform=`translate3d(${laneX(f.lane,f.bw)}px,${f.y}px,20px)`;
  document.querySelectorAll('.lane').forEach((l,i)=>l.classList.toggle('aim',i===f.lane)); }
function move(d){ if(!L.fall||L.paused) return; const n=L.lv.lanes.length; const nl=Math.max(0,Math.min(n-1,L.fall.lane+d)); if(nl!==L.fall.lane){ L.fall.lane=nl; SFX.move(); place(); } }
function hardDrop(){ if(!L.fall||L.paused) return; L.fall.hard=true; SFX.drop(); }
function togglePause(){ if(!L||L.stopOpen) return; L.paused=!L.paused; $('#pz').textContent=L.paused?'Riprendi':'Pausa'; $('#pp').textContent=L.paused?'Riprendi':'Pausa'; if(!L.paused){L.last=performance.now();} else banner('PAUSA'); }
function floorY(lane){ const g=geom(); return g.h-8-62-8-(L.junk[lane]*((L.fall?L.fall.bh:78)+6))-L.fall.bh; }
function tick(now){
  if(!L) return; const dt=Math.min(.05,(now-L.last)/1000); L.last=now;
  if(L.fall && !L.paused && !L.stopOpen){
    const g=geom(); const base=(g.h)/(L.speed*Math.pow(.975,L.i));
    const v=L.fall.hard?base*28:L.fall.soft?base*7:base;
    L.fall.y+=v*dt; const fy=floorY(L.fall.lane);
    if(L.fall.y>=fy){ L.fall.y=fy; place(); land(); } else place();
  }
  L.raf=requestAnimationFrame(tick);
}
function land(){
  const f=L.fall; L.fall=null; const lv=L.lv; const lane=lv.lanes[f.lane]; const right=lv.ans(f.c); const ri=lv.lanes.findIndex(l=>l.id===right);
  document.querySelectorAll('.lane').forEach(l=>l.classList.remove('aim'));

    L.combo++; L.okn++; G.ok++; const mult=Math.min(5,1+Math.floor(L.combo/3)); const pts=100*mult+(f.hard?20:0); G.score+=pts; G.best=Math.max(G.best,L.combo);

    L.lastMsg={ok:true,c:f.c,lane:lane.l,why:why(lv.k,f.c),pts};

    const w=$('#well'); w.classList.remove('glitch'); void w.offsetWidth; w.classList.add('glitch');
    L.junk[f.lane]++; f.el.dataset.lane=f.lane;
    if(L.junk[f.lane]>=4){ L.junk[f.lane]=0; document.querySelectorAll(`#fz .blk.junk`).forEach(b=>{ if(+b.dataset.lane===f.lane){ const r=b.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,'#ff5a1f',30); b.remove(); } }); G.score=Math.max(0,G.score-200); banner('SOVRACCARICO −200'); }

function bumpFoot(i){ const id=L.lv.lanes[i].id; const el=$('#fv'+i); if(el) el.textContent=eur(L.sums[id]); const ft=$('#ft'+i); if(ft){ ft.classList.remove('pulse'); void ft.offsetWidth; ft.classList.add('pulse'); } }

    else { b.classList.add('bad'); SFX.ko(); $('#qfb').innerHTML='✕ '+b.dataset.w; } });
  const r=$('.t3d .hot').getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,'#ffb000',80,1.2);
  $('#nx').onclick=()=>{ G.li++; if(G.li<LEVELS.length) briefing(); else finale(); };
  L=null; window.scrollTo({top:0});
}

/* ================= FINALE ================= */
function finale(){
  SFX.win(); const D=DATA[CFG.co];
  const acc=G.tot?Math.round(100*G.ok/G.tot):0;
  const rank=acc>=90?'S':acc>=80?'A':acc>=65?'B':'C';
  const secs=Math.round((Date.now()-G.t0)/1000);
  $('#app').innerHTML=`<section class="deb">
    <div class="lbl">${D.es} · ${D.name} · tutti i ${LEVELS.length} livelli completati</div>
    <h2 class="t3d">Esercizio <span class="hot">chiuso</span></h2>
    <div class="debg"><div>
      <div class="art plate brushed"><h4>Tutto il percorso in una riga</h4>
        <div class="flow"><span>Assestamento</span><i>›</i><span class="k">Situazione contabile finale</span><i>›</i><span>Epilogo</span><i>›</i><span class="k">Utile ${eur(D.utile)}</span><i>›</i><span>Chiusura</span><i>›</i><span class="k">Bilancio di chiusura quadra</span><i>›</i><span>1/01 riapertura</span><i>›</i><span>Giro contabile</span></div>
        <p>La situazione contabile finale serve a due cose: fa da base per <b>epilogo e chiusura</b> e per redigere il <b>bilancio d'esercizio</b> (Stato patrimoniale e Conto economico del codice civile).</p></div>
      ${G.errors.length?`<div class="art plate brushed" style="margin-top:14px"><h4>Da ripassare (${G.errors.length})</h4><ul class="errs">${G.errors.map(e=>`<li><b>${esc(e.c.n)}</b><span>${e.lv} → ${e.right}</span></li>`).join('')}</ul></div>`:'<div class="check">✓ Nessun errore: percorso perfetto.</div>'}
    </div><div>
      <div class="t3d rank"><span class="hot">${rank}</span></div>
      <div class="statsg"><div class="stat plate brushed"><span class="lbl">Punti</span><div class="v" style="color:var(--amber)">${G.score.toLocaleString('it-IT')}</div></div>
        <div class="stat plate brushed"><span class="lbl">Precisione</span><div class="v">${acc}%</div></div>
        <div class="stat plate brushed"><span class="lbl">Combo max</span><div class="v">${G.best}</div></div></div>
      <div class="rule plate brushed"><span class="lbl">Tempo</span><p class="num">${Math.floor(secs/60)} min ${String(secs%60).padStart(2,'0')} s</p></div>
      <div class="acts"><button class="big" id="again">Nuova partita</button></div></div></div></section>`;
  setTimeout(()=>{ for(let k=0;k<4;k++) setTimeout(()=>burst(W*(.2+Math.random()*.6),H*(.2+Math.random()*.4),['#ffb000','#4fb3ff','#ff8a3d','#3dff8a'][k],70,1.4),k*260); },200);
  $('#again').onclick=()=>intro(); window.scrollTo({top:0});
}

intro();
</script>
</body>
</html>
